name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenCV system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-segmentation.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements-detection.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install pytest ruff

      - name: Lint
        run: ruff check detection/python segmentation scripts boat_detection wind_detection

      # Fast unit tests only (model forward-pass shape, dataset loading,
      # metrics math) — real training (scripts/train_segmentation.py,
      # scripts/train_boat_detection.py) is too slow/heavy to run on
      # every push and is done locally instead. boat_detection's tests
      # do pull the small (~6MB) pretrained yolov8n.pt checkpoint from
      # ultralytics on first run.
      #
      # Run as three SEPARATE pytest invocations, not one combined
      # `pytest detection/python segmentation/tests boat_detection/tests`.
      # segmentation/src/ and boat_detection/src/ both put same-named
      # modules (model.py, dataset.py, metrics.py) on sys.path via their
      # conftest.py; collected in one pytest process, the second
      # package's imports silently resolve to the first package's
      # modules instead (Python's module cache is keyed by bare name).
      # This is a real landmine, not just a CI quirk — don't combine
      # these locally either, and don't add a 4th module with another
      # model.py/dataset.py pair without fixing this properly (proper
      # packages + qualified imports) first.
      - name: Test
        run: |
          pytest detection/python -v
          pytest segmentation/tests -v
          pytest boat_detection/tests -v
          pytest wind_detection/tests -v
