name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenCV system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-segmentation.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install pytest ruff

      - name: Lint
        run: ruff check detection/python segmentation scripts

      # Fast unit tests only (model forward-pass shape, dataset loading,
      # metrics math) — real training (scripts/train_segmentation.py) is
      # too slow/heavy to run on every push and is done locally instead.
      - name: Test
        run: pytest detection/python segmentation/tests -v
